input {
  beats {
    port => 5044
    ssl => true
    ssl_certificate_authorities => ["c:/certs/ca.crt"]
    ssl_certificate => "c:/certs/server.crt"
    ssl_key => "c:/certs/server.key"
    ssl_verify_mode => "force_peer"
  }

  tcp {
    port => 6514
    type => "syslog"
    ssl_enable => true
    ssl_cert => "c:/certs/server.crt"
    ssl_key => "c:/certs/server.key"
  }

  http {
    port => 8080
    ssl => true
    ssl_certificate => "c:/certs/server.crt"
    ssl_key => "c:/certs/server.key"
  }
}

filter {
  # Normalize timestamps
  date {
    match => ["timestamp", "ISO8601", "UNIX", "CISCOTIMESTAMP"]
    target => "@timestamp"
  }

  # Threat intelligence enrichment
  if [src_ip] {
    translate {
      field => "src_ip"
      destination => "threat_intel"
      dictionary_path => "c:/threat_intel/ioc_list.yml"
      refresh_interval => 300
      fallback => "unknown"
    }
  }

  # Windows Event Log processing
  if [type] == "winlog" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:log_level} %{WORD:event_source} %{GREEDYDATA:message}" }
    }
    fingerprint {
      source => ["host", "timestamp", "message"]
      target => "[@metadata][fingerprint]"
      method => "SHA256"
    }
  }

  # Advanced ASA log parsing
  if [type] == "cisco-asa" {
    grok {
      match => { "message" => "%{CISCOTIMESTAMP:timestamp} %{IP:src_ip} %{IP:dst_ip} %{GREEDYDATA:message}" }
      break_on_match => false
    }
    cidr {
      address => [ "%{src_ip}" ]
      network => [ "10.0.0.0/8", "192.168.0.0/16" ]
      add_tag => [ "internal_ip" ]
    }
  }

  # Common Event Format (CEF) parsing
  if [type] == "cef" {
    cef {
      ignore_unknown_fields => true
    }
  }
}

output {
  # Primary storage
  elasticsearch {
    hosts => ["es-node1:9200", "es-node2:9200", "es-node3:9200"]
    index => "siem-%{+YYYY.MM.dd}"
    ssl => true
    cacert => "c:/certs/elasticsearch-ca.pem"
    user => "logstash_writer"
    password => "${ES_PASSWORD}"
    pipeline => "siem_processing"
  }

  # Alerting pipeline
  if [threat_intel] != "unknown" or [tags] contains "malicious" {
    pipeline {
      send_to => "alert_processing"
    }
  }

  # Debug output (disabled in production)
  if [log_level] == "debug" {
    stdout {
      codec => rubydebug
    }
  }
}
